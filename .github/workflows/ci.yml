name: CI

# Verificações de repositório (assembleiarr/app-catalog docs/padroes/ci-devsecops.md) e os testes
# dos hooks deste repo.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A mesma config do hook local, em todos os arquivos do repo.
  higiene:
    timeout-minutes: 15
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Instala o pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.7.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure

  # Histórico inteiro; o hook só olha o commit. CLI do gitleaks direto, como no security.yml do
  # al-rr/platform-modules (a gitleaks-action pede licença paga em repo de org).
  gitleaks:
    timeout-minutes: 10
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Instala o gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o "${archive}" "${base_url}/${archive}"
          curl -fsSL -o gitleaks_checksums.txt "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" gitleaks_checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          installed="$(/usr/local/bin/gitleaks version)"
          echo "gitleaks ${installed}"
          [ "${installed}" = "${GITLEAKS_VERSION}" ]
      - name: gitleaks detect (histórico inteiro)
        run: gitleaks detect --source . --no-banner --redact

  # O squash usa o título do PR como mensagem do commit: ele segue Conventional Commits, com os
  # tipos do fluxo-de-contribuicao.md.
  titulo-do-pr:
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Título em Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|test|docs|ci|build|chore)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ "${TITLE}" =~ ${pattern} ]]; then
            echo "Título ok: ${TITLE}"
          else
            echo "::error::Título fora de Conventional Commits: '${TITLE}'."
            echo "Formato: <tipo>: <descrição>. Tipos: feat, fix, refactor, test, docs, ci, build, chore."
            exit 1
          fi

  # Testes dos hooks publicados no .pre-commit-hooks.yaml.
  testes:
    timeout-minutes: 10
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Instala o pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.7.0
      - name: tests/test_hooks.sh
        run: ./tests/test_hooks.sh
